plugins {
    id 'com.android.application'
}

android {
    namespace 'com.anormal.nfcacici'
    compileSdk 35

    defaultConfig {
        applicationId 'com.anormal.nfcacici'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Kendi telefonun için: release de debug anahtarıyla imzalanır, direkt kurulabilir.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
