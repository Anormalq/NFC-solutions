name: APK Derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: APK derle
        run: gradle --no-daemon assembleRelease

      - name: APK'yı yeniden adlandır
        run: cp app/build/outputs/apk/release/app-release.apk NFC-Link-Acici.apk

      - name: Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: NFC-Link-Acici
          path: NFC-Link-Acici.apk

      - name: Release oluştur (telefondan kolay indirmek için)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NFC Link Açıcı (derleme ${{ github.run_number }})
          make_latest: true
          files: NFC-Link-Acici.apk
