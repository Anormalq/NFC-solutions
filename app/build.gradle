plugins {
    id 'com.android.application'
}

android {
    namespace 'com.anormal.nfcacici'
    compileSdk 35

    defaultConfig {
        applicationId 'com.anormal.nfcacici'
        minSdk 21
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    // Sabit imza anahtarı: böylece yeni sürümler eskisinin üstüne kaldırmadan kurulur.
    // (Sadece kişisel kullanım için; repo gizli tutulmalı.)
    signingConfigs {
        sabit {
            storeFile file('nfc-acici.jks')
            storePassword 'nfcacici'
            keyAlias 'nfcacici'
            keyPassword 'nfcacici'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.sabit
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
